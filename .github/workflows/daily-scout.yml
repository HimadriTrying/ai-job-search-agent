name: daily-scout
# Scheduled discovery sweep — the "runs while you sleep" piece.
# This is NOT a continuously-thinking agent; it is a cron trigger that wakes Claude Code
# headless, runs the job-scout skill once, commits the digest, and stops.
#
# PRIVACY: digests and the watchlist name the companies you are targeting. This workflow
# therefore refuses to run in a public repository — run it from a PRIVATE copy of the repo
# (not a fork; forks of public repos are always public). See README → Scheduled scout.

on:
  schedule:
    - cron: "0 6 * * 1-5"   # 06:00 UTC, weekdays
  workflow_dispatch: {}      # allow manual runs

jobs:
  scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to commit the digest back to the (private) repo
    steps:
      - name: Privacy guard — refuse to run in a public repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" != "true" ]; then
            echo "::error::This repository is PUBLIC. The scout reads your private watchlist and writes digests naming your target companies; on a public repo its logs, artifacts, and commits would all be visible to anyone. Run it from a private copy instead — see README → Scheduled scout."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check scout inputs are present
        # watchlist.txt and config.yaml are gitignored in the public repo; in your private
        # copy they must be committed (force-added) or the checkout arrives without them.
        run: |
          if [ ! -f .claude/skills/job-scout/watchlist.txt ]; then
            echo "::error::No watchlist found in this copy. Commit your scout inputs: git add -f .claude/skills/job-scout/watchlist.txt .claude/skills/job-scout/config.yaml && git commit && git push"
            exit 1
          fi

      - name: Install rtk (compresses command output before it reaches the model)
        # The committed .claude/settings.json PreToolUse hook rewrites shell
        # commands to rtk equivalents; the hook no-ops if this step fails, so
        # the sweep still runs — just without the token savings.
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/master/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run job-scout headless
        # Claude Code can run as a one-shot CLI without a TTY — that is what makes
        # scheduled jobs and CI integration possible.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "Run the job-scout skill: sweep the watchlist, score against the rubric, \
            write today's digest to data/digests/, and stop. Do not tailor anything." \
            --allowedTools "Read,Write,Bash,WebSearch"

      - name: Commit digest
        # -f because data/digests/*.md is gitignored (a safety net for the public repo);
        # the privacy guard above guarantees we only ever get here in a private one.
        run: |
          git config user.name  "job-scout-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/digests/
          git commit -m "chore: daily scout digest $(date -u +%F)" || echo "nothing to commit"
          git push || echo "nothing to push"
